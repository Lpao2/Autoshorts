[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "autoshorts"
version = "0.1.0"
description = "Local-first long-form to short-form video pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["python-dotenv>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]
automation = [
  "yt-dlp>=2026.8,<2027",
  "yt-dlp-ejs>=0.8,<1",
  "playwright>=1.56,<2",
]
transcription = ["faster-whisper>=1.2,<2", "av>=11,<19"]
analysis = ["google-genai>=2.31,<3"]
youtube-oauth = [
  "google-auth-oauthlib>=1.2,<2",
  "google-api-python-client>=2.149,<3",
]

[project.scripts]
autoshorts = "autoshorts.main:main"
autoshorts-gui = "autoshorts.gui:main"
autoshorts-install-desktop = "autoshorts.desktop:main"
autoshorts-publish = "autoshorts.publishing_cli:main"
autoshorts-editorial = "autoshorts.editorial_cli:main"
autoshorts-scheduler = "autoshorts.scheduler_cli:main"
autoshorts-ingest = "autoshorts.ingestion_cli:main"
autoshorts-produce = "autoshorts.production_cli:main"
autoshorts-orchestrator = "autoshorts.orchestrator_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
